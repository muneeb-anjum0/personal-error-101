packages:
  - "apps/*"
  - "apps/generator/*"
  - "packages/*"
overrides:
  "fast-uri@3": "3.1.5"
  "fast-uri@4": "4.1.2"
  postcss: "8.5.25"
  sharp: "0.35.0"
onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - "esbuild"
  - "sharp"
minimumReleaseAgeExclude:
  - "@playwright/test@1.62.1"
  - fastify@5.11.0
  - playwright-core@1.62.1
  - playwright@1.62.1
  - vite@8.2.0
allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  sharp: true
