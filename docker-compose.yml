services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      - --model
      - /models/Qwen3-8B-Q4_K_M.gguf
      - --alias
      - Qwen3-8B-Q4_K_M
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - ${LOCAL_AI_CONTEXT_SIZE:-8192}
      - --parallel
      - "1"
      - --n-gpu-layers
      - ${LOCAL_AI_GPU_LAYERS:-0}
      - --threads
      - ${LOCAL_AI_THREADS:-9}
      - --threads-batch
      - ${LOCAL_AI_BATCH_THREADS:-9}
      - --batch-size
      - ${LOCAL_AI_BATCH_SIZE:-32}
      - --ubatch-size
      - ${LOCAL_AI_UBATCH_SIZE:-16}
      - --jinja
      - --reasoning
      - "off"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ${LOCAL_AI_MODEL_DIR:-/home/muneebanjum/Models/Qwen3-8B-GGUF}:/models:ro
    cpus: 9.0
    restart: unless-stopped

  portfolio:
    build:
      context: .
      dockerfile: docker/portfolio/Dockerfile
    environment:
      NODE_ENV: production
      PORTFOLIO_PORT: 3000
      PORTFOLIO_DATA_DIR: /workspace/data
    ports:
      - "3000:3000"
    volumes:
      - ./data:/workspace/data:ro
      - ./assets:/workspace/assets:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  generator-api:
    build:
      context: .
      dockerfile: docker/generator-api/Dockerfile
    env_file:
      - path: apps/generator/server/.env.local
        required: false
    environment:
      NODE_ENV: production
      DOCKER_CONTAINER: "true"
      GENERATOR_HOST: 0.0.0.0
      GENERATOR_API_PORT: 4000
      GENERATOR_API_URL: http://localhost:4000
      GENERATOR_DATA_DIR: /workspace/data
      GITHUB_USERNAME: ${GITHUB_USERNAME:-muneeb-anjum0}
      GITHUB_INCLUDE_PRIVATE: ${GITHUB_INCLUDE_PRIVATE:-false}
      LOCAL_AI_MODEL_PATH: /models/Qwen3-8B-Q4_K_M.gguf
      LOCAL_AI_BASE_URL: ${LOCAL_AI_BASE_URL:-http://llama-server:8080/v1}
      LOCAL_AI_MODEL: ${LOCAL_AI_MODEL:-Qwen3-8B-Q4_K_M}
      LOCAL_AI_API_KEY: ${LOCAL_AI_API_KEY:-local}
      LOCAL_AI_CONTEXT_SIZE: ${LOCAL_AI_CONTEXT_SIZE:-8192}
      LOCAL_AI_PARALLEL_REQUESTS: ${LOCAL_AI_PARALLEL_REQUESTS:-1}
      LOCAL_AI_GPU_LAYERS: ${LOCAL_AI_GPU_LAYERS:-0}
      LOCAL_AI_MAX_VRAM_GB: ${LOCAL_AI_MAX_VRAM_GB:-5}
      LOCAL_AI_SERVER_PORT: ${LOCAL_AI_SERVER_PORT:-8080}
      LOCAL_AI_SERVER_HOST: ${LOCAL_AI_SERVER_HOST:-127.0.0.1}
      LOCAL_AI_SERVER_EXECUTABLE: ${LOCAL_AI_SERVER_EXECUTABLE:-}
      LOCAL_AI_RUNTIME_MODE: ${LOCAL_AI_RUNTIME_MODE:-external}
      CI: "true"
      FIREBASE_CLI_DISABLE_UPDATE_CHECK: "true"
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      llama-server:
        condition: service_healthy
    volumes:
      - ./data:/workspace/data
      - ./assets:/workspace/assets
      - ${LOCAL_AI_MODEL_DIR:-/home/muneebanjum/Models/Qwen3-8B-GGUF}:/models:ro
      - ${FIREBASE_CLI_CONFIG_DIR:-/home/muneebanjum/.config/configstore}:/home/node/.config/configstore
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  generator-ui:
    build:
      context: .
      dockerfile: docker/generator-ui/Dockerfile
    environment:
      NODE_ENV: production
      GENERATOR_UI_PORT: 4173
      VITE_GENERATOR_API_URL: http://localhost:4000
    ports:
      - "127.0.0.1:4173:4173"
    depends_on:
      generator-api:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
